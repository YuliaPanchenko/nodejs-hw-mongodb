tags:
  - Contacts
summary: Edit contacts
operationId: editContact
description: 'Edit a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '34e4decdd286b30065d54ad7'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Afrodita'
          phoneNumber:
            description: "Contact's phoneNumber"
            type: number
            example: 12345678
          email:
            description: "Contact's email"
            type: string
            example: Afrodita@i.com
          isFavourite:
            description: "Contact's favorite"
            type: boolean
          contactType:
            description: "Contact's contactType"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            description: "User's photo"
            type: string
            example: url
responses:
  '200':
    description: Edit a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully edit a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
