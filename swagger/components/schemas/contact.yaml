type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: John Doe@i.com
  phoneNumber:
    description: "Contact's number"
    type: number
    example: 12345678
  isFavourite:
    description: "Contact's favorite"
    type: boolean
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "User's id"
    type: string
    example: 65ca67e7ae7f10c88b598384
  photo:
    description: "User's photo"
    type: string
    example: url
